<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Informe de inspección · AutoMarketPro (prototipo)</title>
<style>
:root{--navy:#0f1d3d;--blue:#2f7fd8;--bg:#eef3fa;--line:#dfe6f1;--ink:#16233f;--muted:#5d6b85;--ok:#2e8b3e;--warn:#e7b400;--bad:#c62828}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{display:grid;grid-template-columns:360px 1fr;min-height:100vh}
.editor{background:#fff;border-right:1px solid var(--line);padding:16px;overflow:auto;max-height:100vh;position:sticky;top:0}
.editor h2{font-size:13px;color:var(--navy);margin:20px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.editor label{display:block;font-size:12px;color:var(--muted);margin:8px 0 2px}
.editor input,.editor select,.editor textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:13px;background:#fff}
.editor textarea{min-height:58px;resize:vertical}
.comp{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.comp .t{font-weight:700;font-size:13px;margin-bottom:4px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.photos input{font-size:11px;padding:4px}
.note{font-size:12px;color:var(--muted);background:#f4f7fc;border-radius:6px;padding:8px;margin-top:10px;line-height:1.4}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.btn{background:var(--navy);color:#fff;border:0;padding:8px 12px;border-radius:6px;font-size:13px;cursor:pointer}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.preview{padding:24px;overflow:auto}
.sheet{background:#f6f9fd;max-width:820px;margin:0 auto;border-radius:10px;box-shadow:0 8px 30px rgba(15,29,61,.12);overflow:hidden}
.hd{background:linear-gradient(100deg,#0b1633,#1c3c7a);color:#fff;padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;font-style:italic;letter-spacing:.04em;font-size:24px}
.brand span{color:#7db7ff}
.brand small{display:block;font-style:normal;font-weight:600;font-size:9px;letter-spacing:.3em;opacity:.8}
.tt{background:rgba(47,127,216,.85);padding:10px 16px;border-radius:8px;font-weight:700;font-size:15px;line-height:1.2}
.body{padding:22px 26px}
.model{font-size:32px;font-weight:800;margin:4px 0 14px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.fact{text-align:center;padding:4px 8px;border-right:1px solid var(--line)}
.fact:last-child{border:0}
.fact small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.fact div{font-size:15px;font-weight:600;margin-top:3px}
.gen{display:flex;flex-wrap:wrap;margin:18px 0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.gen .l{background:var(--navy);color:#fff;font-weight:800;padding:14px 18px;flex:1;font-size:16px}
.gen .r{padding:12px 18px;display:flex;align-items:center}
.gen p{margin:0;padding:12px 18px;color:var(--muted);font-size:14px;width:100%;border-top:1px solid var(--line)}
.sec{font-size:18px;font-weight:800;margin:24px 0 10px;padding-left:10px;border-left:5px solid var(--blue)}
.row{display:grid;grid-template-columns:110px 1fr 1fr 1.2fr;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;align-items:center;break-inside:avoid}
.row .name{font-weight:800;font-size:15px;text-align:center}
.ph{aspect-ratio:4/3;background:#dfe6f1;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.ph img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-block;padding:4px 14px;border-radius:999px;font-weight:800;font-size:12px;color:#fff;letter-spacing:.03em}
.b-bien{background:var(--ok)}
.b-regular{background:var(--warn);color:#2a2a2a}
.b-malo,.b-impedimentos,.b-vencida{background:var(--bad)}
.b-vigente{background:var(--ok)}
.desc{font-size:13px;line-height:1.4}
.desc .badge{margin-bottom:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center;break-inside:avoid}
.card h4{margin:0;background:var(--navy);color:#fff;padding:10px;font-size:13px}
.card .c{padding:12px}
.card p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.35}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.editor{position:static;max-height:none}body:not(.pdf-mode) .row{grid-template-columns:1fr 1fr}body:not(.pdf-mode) .row .name{grid-column:1/-1}body:not(.pdf-mode) .grid4{grid-template-columns:1fr 1fr}body:not(.pdf-mode) .facts{grid-template-columns:1fr 1fr}}
@media print{
  .editor,.btns{display:none!important}
  .wrap{display:block}
  .preview{padding:0}
  .sheet{box-shadow:none;max-width:none;border-radius:0}
  body{background:#fff}
  @page{margin:10mm}
}

<body>
<div class="wrap">
  <aside class="editor">
    <div class="btns">
      <button class="btn" id="descargar">Descargar PDF</button>
      <button class="btn alt" id="exportar">Exportar datos</button>
      <label class="btn alt" style="margin:0;display:inline-flex;align-items:center;cursor:pointer">Importar datos<input type="file" id="importar" accept="application/json" hidden></label>
    </div>
    <div class="note">Prototipo. Las fotos no se guardan al exportar los datos. La verificación policial y la VTV se cargan a mano.</div>

    <h2>Datos del vehículo</h2>
    <label>Marca y modelo</label><input data-path="vehiculo.modelo">
    <label>Fecha de inspección</label><input type="date" data-path="vehiculo.fecha">
    <label>Patente</label><input data-path="vehiculo.patente">
    <label>Año</label><input data-path="vehiculo.anio">
    <label>Kilometraje</label><input data-path="vehiculo.km">

    <h2>Estado general</h2>
    <label>Estado</label><select data-path="general.estado"><option value="bueno">Bueno</option><option value="regular">Regular</option><option value="malo">Malo</option></select>
    <label>Resumen</label><textarea data-path="general.resumen"></textarea>

    <h2>Inspección por componentes</h2>
    <div id="componentes"></div>

    <h2>Información complementaria</h2>
    <div id="complementaria"></div>
  </aside>

  <main class="preview"><div class="sheet" id="sheet"></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const ESTADOS = [["bien","Bien"],["regular","Regular"],["malo","Malo"]];

const DEFAULT = {
  vehiculo: { modelo: "Peugeot 208", fecha: "2026-06-16", patente: "AB123CD", anio: "2022", km: "44.827" },
  general: { estado: "bueno", resumen: "Vehículo en buen estado general, con detalles menores a considerar." },
  componentes: [
    { nombre: "Carrocería", estado: "regular", texto: "Se detecta masilla en el pasarrueda delantero y en ambas puertas del lado conductor. Capó repintado, con reparaciones previas." },
    { nombre: "Neumáticos", estado: "bien", texto: "Cuatro cubiertas año 2022, con buen dibujo. Se observa mayor desgaste en el eje delantero." },
    { nombre: "Luces", estado: "regular", texto: "La luz alta derecha se encuentra quemada. El resto del sistema de iluminación funciona correctamente." },
    { nombre: "Batería", estado: "regular", texto: "Batería en estado regular, con carga de 12,3 V. Se recomienda su control y eventual reemplazo." },
    { nombre: "Distribución", estado: "bien", texto: "Sistema de distribución en correcto estado, sin ruidos ni pérdidas." },
    { nombre: "Climatizador A/C", estado: "bien", texto: "El sistema de climatización funciona correctamente, con adecuada refrigeración y ventilación." },
    { nombre: "Interior", estado: "bien", texto: "Interior en buen estado general, con tapizados y terminaciones sin daños relevantes." },
    { nombre: "Frenos", estado: "regular", texto: "Pastillas de freno delanteras con aprox. 30% de vida útil. Discos en buen estado. Se recomienda su reemplazo próximamente." },
    { nombre: "Motor", estado: "bien", texto: "Motor en buen estado general, sin pérdidas de fluidos ni anomalías visibles. Funcionamiento dentro de los parámetros normales." },
    { nombre: "Tren Delantero", estado: "bien", texto: "Sin juegos ni ruidos anormales. Bujes y componentes en buen estado." },
    { nombre: "Transmisión", estado: "bien", texto: "Transmisión en buen estado, con cambios precisos y sin anomalías durante la prueba." }
  ],
  complementaria: {
    llaves: { estado: "bien", texto: "Se entregan 2 llaves originales en buen estado." },
    manuales: { estado: "bien", texto: "Se entrega manual del vehículo." },
    policial: { estado: "bien", texto: "Sin impedimentos para la circulación ni para la transferencia." },
    vtv: { estado: "vigente", hasta: "Junio 2027" }
  }
};

let data = structuredClone(DEFAULT);
// Las fotos viven en memoria (no se exportan): fotos[i] = [url1, url2]
let fotos = DEFAULT.componentes.map(() => [null, null]);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const getPath = (o, p) => p.split(".").reduce((a, k) => a?.[k], o);
function setPath(o, p, v) {
  const k = p.split("."); let t = o;
  for (let i = 0; i < k.length - 1; i++) t = t[k[i]];
  t[k[k.length - 1]] = v;
}
function fechaLarga(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${Number(d)} de ${MESES[Number(m) - 1]} de ${y}`;
}
const badge = (clase, texto) => `<span class="badge ${clase}">${esc(texto)}</span>`;
const estadoBadge = e => badge("b-" + e, { bien: "BIEN", regular: "REGULAR", malo: "MALO" }[e] || e.toUpperCase());

// ---------- Editor ----------
function sel(path, opciones) {
  return `<select data-path="${path}">` + opciones.map(([v, t]) =>
    `<option value="${v}" ${getPath(data, path) === v ? "selected" : ""}>${t}</option>`).join("") + `</select>`;
}
function buildEditor() {
  document.getElementById("componentes").innerHTML = data.componentes.map((c, i) => `
    <div class="comp">
      <div class="t">${esc(c.nombre)}</div>
      ${sel(`componentes.${i}.estado`, ESTADOS)}
      <textarea data-path="componentes.${i}.texto" style="margin-top:6px">${esc(c.texto)}</textarea>
      <div class="photos">
        <input type="file" accept="image/*" data-foto="${i},0">
        <input type="file" accept="image/*" data-foto="${i},1">
      </div>
    </div>`).join("");

  const cp = data.complementaria;
  document.getElementById("complementaria").innerHTML = `
    <div class="comp"><div class="t">Llaves</div>${sel("complementaria.llaves.estado", ESTADOS)}
      <textarea data-path="complementaria.llaves.texto" style="margin-top:6px">${esc(cp.llaves.texto)}</textarea></div>
    <div class="comp"><div class="t">Manuales</div>${sel("complementaria.manuales.estado", ESTADOS)}
      <textarea data-path="complementaria.manuales.texto" style="margin-top:6px">${esc(cp.manuales.texto)}</textarea></div>
    <div class="comp"><div class="t">Verificación policial</div>${sel("complementaria.policial.estado", [["bien","Sin impedimentos"],["impedimentos","Con impedimentos"]])}
      <textarea data-path="complementaria.policial.texto" style="margin-top:6px">${esc(cp.policial.texto)}</textarea></div>
    <div class="comp"><div class="t">VTV</div>${sel("complementaria.vtv.estado", [["vigente","Vigente"],["vencida","Vencida"]])}
      <label>Vigente / vencida hasta</label><input data-path="complementaria.vtv.hasta" value="${esc(cp.vtv.hasta)}"></div>`;

  // Valores de los campos simples
  document.querySelectorAll("aside [data-path]").forEach(el => {
    if (el.tagName !== "SELECT" && el.tagName !== "TEXTAREA" || el.tagName === "TEXTAREA") {
      if (el.tagName !== "SELECT") el.value = getPath(data, el.dataset.path) ?? "";
    }
    if (el.tagName === "TEXTAREA") el.value = getPath(data, el.dataset.path) ?? "";
  });
}

document.querySelector("aside").addEventListener("input", e => {
  const p = e.target.dataset.path;
  if (!p) return;
  setPath(data, p, e.target.value);
  render();
});
document.querySelector("aside").addEventListener("change", e => {
  const p = e.target.dataset.path;
  if (p) { setPath(data, p, e.target.value); render(); }
  if (e.target.dataset.foto) {
    const [i, j] = e.target.dataset.foto.split(",").map(Number);
    const f = e.target.files[0];
    if (f) fotos[i][j] = URL.createObjectURL(f);
    render();
  }
});

// ---------- Informe ----------
function foto(i, j) {
  return fotos[i][j] ? `<img src="${fotos[i][j]}" alt="${esc(data.componentes[i].nombre)} foto ${j + 1}">` : `Foto ${j + 1}`;
}
function render() {
  const v = data.vehiculo, g = data.general, cp = data.complementaria;
  const gen = { bueno: ["BUENO", "b-bien"], regular: ["REGULAR", "b-regular"], malo: ["MALO", "b-malo"] }[g.estado];
  const vtvOk = cp.vtv.estado === "vigente";
  const policialOk = cp.policial.estado === "bien";
  const estadoCard = e => e === "impedimentos" ? badge("b-impedimentos", "IMPEDIMENTOS") : estadoBadge(e);

// ---------- Botones ----------
document.getElementById("descargar").onclick = async () => {
  const boton = document.getElementById("descargar");
  boton.disabled = true; boton.textContent = "Generando...";
  document.body.classList.add("pdf-mode");
  try {
    await html2pdf().set({
      margin: [8, 8, 8, 8],
      filename: `informe-${data.vehiculo.patente || "vehiculo"}.pdf`,
      image: { type: "jpeg", quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true, backgroundColor: "#f5f8fc", windowWidth: 1200 },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
      pagebreak: { mode: ["css", "legacy"], avoid: [".row", ".card", ".gen", ".facts", ".sec"] }
    }).from(document.getElementById("sheet")).save();
  } catch (err) {
    alert("No se pudo generar el PDF: " + (err && err.message ? err.message : err));
  } finally {
    document.body.classList.remove("pdf-mode");
    boton.disabled = false; boton.textContent = "Descargar PDF";
  }
};
document.getElementById("exportar").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `informe-${data.vehiculo.patente || "vehiculo"}.json`;
  a.click();
};
document.getElementById("importar").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const nuevo = JSON.parse(await f.text());
    data = { ...structuredClone(DEFAULT), ...nuevo };
    data.componentes = DEFAULT.componentes.map((c, i) => ({ ...c, ...(nuevo.componentes?.[i] || {}) }));
    buildEditor(); render();
  } catch (err) {
    alert("El archivo no es un informe válido.");
  }
};

buildEditor();
render();
</script>
